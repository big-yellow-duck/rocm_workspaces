[workspace]
name = "rocm10-gfx1152-pytorch"
version = "0.1.0"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.35" }]

[dependencies]
python = "3.12.*"
uv = "*"
cmake = ">=3.26,<4"
ninja = "*"
git = "*"
rust = "*"
gxx_linux-64 = "14.*"
pkg-config = "*"
patch = "*"

[pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://stable.repo.amd.com/rocm/whl-next/"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
numpy = ">=2,<3"
rocm = { version = "==10.0.0", extras = ["libraries", "devel", "device-gfx1152"] }
torch = { version = "==2.13.0+rocm10.0.0", extras = ["device-gfx1152"] }

# Build dependencies must be present for --no-build-isolation.
setuptools = "<80.0.0,>=77.0.3"
setuptools-scm = ">=8"
setuptools-rust = ">=1.9.0"
packaging = ">=26.2"
wheel = "*"
jinja2 = ">=3.1.6"

# Focused backend, kernel, and workspace development checks.
pytest = "*"
pytest-timeout = "*"
tblib = "*"
expecttest = "*"
pre-commit = ">=4.5.1"
ruff = "*"

[activation]
scripts = ["scripts/activate_rocm.sh"]

[tasks]
check-torch = "python scripts/check_torch.py"
check-smi = "amd-smi static --asic"
smoke = "python scripts/smoke_rocm.py"
install-flydsl = "bash scripts/install_flydsl.sh"
vectoradd = "python 00vectoradd/run.py"
profile-vectoradd = "python 00vectoradd/profile.py"
view-vectoradd = "bash 00vectoradd/view.sh"
